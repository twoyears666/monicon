name: Build Monicon

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned iPadOS app
        run: |
          xcodebuild \
            -project Monicon.xcodeproj \
            -scheme Monicon \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Monicon.app build/Payload/
          cd build && zip -qry Monicon-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Monicon-unsigned-ipa
          path: build/Monicon-unsigned.ipa

  tipa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build TrollStore packaging hook
        run: |
          echo "TrollStore packaging requires a device-owner supplied signing/injection step."
          echo "The unsigned IPA from the build job is the input artifact."

