name: Build Monicon TrollStore TIPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Prepare iOS libuvc/libusb dependencies
        run: |
          git clone --depth 1 https://github.com/danylokos/LiveView.git /tmp/LiveView
          cp -R /tmp/LiveView/Thirdparties .

      - name: Build iPadOS 16 app
        run: |
          xcodebuild \
            -project Monicon.xcodeproj \
            -scheme Monicon \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Validate app bundle and package TIPA
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/Monicon.app"
          test -d "$APP"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          test -f "$APP/$EXECUTABLE"
          file "$APP/$EXECUTABLE" | grep -E "Mach-O|executable"
          mkdir -p build/Payload
          ditto "$APP" "build/Payload/Monicon.app"
          codesign --force --deep --sign - --entitlements Monicon/MoniconUSB.entitlements "build/Payload/Monicon.app"
          cd build
          /usr/bin/zip -qry -y Monicon-ios16.tipa Payload
          unzip -l Monicon-ios16.tipa | grep -E "Payload/Monicon.app/Monicon$|Payload/Monicon.app/Info.plist$"
          printf '%s\n' "1. Download the GitHub Actions artifact ZIP." "2. Unzip that outer ZIP once." "3. Install the inner Monicon-ios16.tipa file with TrollStore." "Do not rename the outer artifact ZIP to .tipa." > TIPA-INSTALL.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Monicon-ios16-tipa
          path: |
            build/Monicon-ios16.tipa
            build/TIPA-INSTALL.txt
