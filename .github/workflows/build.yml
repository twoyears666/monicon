name: Build Monicon TrollStore TIPA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tipa:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Prepare iOS libuvc/libusb dependencies
        run: |
          git clone --depth 1 https://github.com/danylokos/LiveView.git /tmp/LiveView
          cp -R /tmp/LiveView/Thirdparties .
      - name: Build iPadOS 16 app
        run: |
          xcodebuild \
            -project Monicon.xcodeproj \
            -scheme Monicon \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Package TrollStore TIPA
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/Monicon.app build/Payload/
          cd build
          zip -qry Monicon-ios16.tipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Monicon-ios16-tipa
          path: build/Monicon-ios16.tipa
